# ==========================================

# FLOWTTER SERVER

# ==========================================

spring.application.name=FlowtterServer
server.port=${PORT:8080}

# ==========================================

# CONNEXION POSTGRESQL (LOCAL)

# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/flowter
spring.datasource.username=postgres
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================

# CONFIGURATION JPA / HIBERNATE

# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================

# CONFIGURATION DU POOL DE CONNEXIONS

# ==========================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ==========================================

# CONFIGURATION SUPABASE

# ==========================================

supabase.url=https://bnhlqozcbmnqewllrnkl.supabase.co
supabase.key=${SUPABASE_KEY}

# ==========================================

# LOGS

# ==========================================

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
