# ==========================================
# FLOWTTER SERVER
# ==========================================

spring.application.name=FlowtterServer
server.port=${PORT:8080}


# ==========================================
# CONNEXION POSTGRESQL (RAILWAY)
# ==========================================

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# CONFIGURATION JPA / HIBERNATE
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# CONFIGURATION DU POOL DE CONNEXIONS
# ==========================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000


# ==========================================
# LOGS — CONFIGURATION RAILWAY
# ==========================================

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO